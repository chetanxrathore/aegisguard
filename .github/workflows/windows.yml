name: Windows audit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: ${{ matrix.os }} / ${{ matrix.engine }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
        engine: [powershell, pwsh]
        include:
          - os: windows-11-arm
            engine: pwsh
    env:
      REPORT_FILE: aegisguard-${{ matrix.os }}-${{ matrix.engine }}-attempt-${{ github.run_attempt }}.html
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test BitLocker verdicts against known inputs
        shell: cmd
        run: ${{ matrix.engine }} -NoProfile -NonInteractive -File tests\BitLocker.ps1
      - name: Run the comprehensive audit and check its report
        id: smoke
        shell: cmd
        run: ${{ matrix.engine }} -NoProfile -NonInteractive -File tests\WindowsSmoke.ps1 -ReportPath "%RUNNER_TEMP%\%REPORT_FILE%"
      - name: Upload the HTML report
        id: report
        if: ${{ !cancelled() && (steps.smoke.outcome == 'success' || steps.smoke.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/${{ env.REPORT_FILE }}
          archive: false
          if-no-files-found: warn
      - name: Link the HTML report in the run summary
        if: ${{ !cancelled() && steps.report.outputs.artifact-url != '' }}
        shell: pwsh
        env:
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          "[Open full HTML report]($env:REPORT_URL)" >> $env:GITHUB_STEP_SUMMARY
